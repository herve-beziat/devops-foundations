name: scanopy

services:
  daemon:
    image: ghcr.io/scanopy/scanopy/daemon:latest
    container_name: scanopy-daemon
    network_mode: host
    privileged: true
    restart: unless-stopped
    environment:
      - SCANOPY_SERVER_URL=http://localhost:60072
      - SCANOPY_NETWORK_ID=84db8d55-2acc-4ef4-881f-8b0d18b6b7df
      - SCANOPY_DAEMON_API_KEY=scp_d_UodVFBirXvidGDq9YiRLPERxsP4fG2rh
      - SCANOPY_USER_ID=690a11ff-8ddf-4418-bab4-8887bbd706d0
      - SCANOPY_NAME=scanopy-daemon-local-docker
      - SCANOPY_MODE=daemon_poll
    volumes:
      - daemon-config:/root/.config/daemon
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scanopy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - scanopy

  server:
    image: ghcr.io/scanopy/scanopy/server:latest
    ports:
      - "60072:60072"
    environment:
      SCANOPY_LOG_LEVEL: ${SCANOPY_LOG_LEVEL:-info}
      SCANOPY_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/scanopy
      SCANOPY_WEB_EXTERNAL_PATH: /app/static
      SCANOPY_PUBLIC_URL: ${SCANOPY_PUBLIC_URL:-http://localhost:60072}
      SCANOPY_INTEGRATED_DAEMON_URL: http://localhost:60073
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      daemon:
        condition: service_started
    restart: unless-stopped
    networks:
      - scanopy

volumes:
  postgres_data:
  daemon-config:

networks:
  scanopy:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16
          gateway: 172.31.0.1