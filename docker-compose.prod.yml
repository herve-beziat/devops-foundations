services:
  traefik:
    # Redémarre automatiquement sauf si arrêté manuellement
    restart: unless-stopped
    logging:
      # Stocke les logs en JSON avec rotation automatique
      driver: json-file
      options:
        # Taille maximale d'un fichier de log
        max-size: "10m"
        # Nombre maximum de fichiers de log conservés
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  postgres:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  redis:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  mailhog:
    restart: unless-stopped
