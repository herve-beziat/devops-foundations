services:
  traefik:
    image: traefik:v3.0
    ports:
      - "80:80"
      - "443:443"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-http.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik-http.entrypoints=web"
      - "traefik.http.routers.traefik-http.middlewares=https-redirect@file"
      - "traefik.http.routers.traefik-secure.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik-secure.entrypoints=websecure"
      - "traefik.http.routers.traefik-secure.tls=true"
      - "traefik.http.routers.traefik-secure.service=api@internal"
      - "traefik.http.routers.traefik-secure.middlewares=basic-auth@file"
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/dynamic:ro
      - ./traefik/certs:/certs:ro
    # Traefik est sur les deux réseaux car il route vers le frontend ET le backend
    networks:
      - frontend
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # PostgreSQL est isolé sur le réseau backend uniquement
    # Le frontend ne peut pas y accéder directement
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  redis:
    image: redis:7-alpine
    # Redis est isolé sur le réseau backend uniquement
    networks:
      - backend
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    # MailHog est sur le réseau backend car le backend l'utilise pour envoyer des emails
    # Traefik y accède aussi pour exposer l'UI via mail.localhost
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailhog.rule=Host(`mail.localhost`)"
      - "traefik.http.routers.mailhog.entrypoints=web"
      - "traefik.http.routers.mailhog.middlewares=https-redirect@file"
      - "traefik.http.routers.mailhog-secure.rule=Host(`mail.localhost`)"
      - "traefik.http.routers.mailhog-secure.entrypoints=websecure"
      - "traefik.http.routers.mailhog-secure.tls=true"
      - "traefik.http.services.mailhog.loadbalancer.server.port=8025"
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    depends_on:
      - postgres
    # Adminer est sur le réseau backend car il accède à PostgreSQL
    # Traefik y accède aussi pour exposer l'UI via db.localhost
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=Host(`db.localhost`)"
      - "traefik.http.routers.adminer.entrypoints=web"
      - "traefik.http.routers.adminer.middlewares=https-redirect@file"
      - "traefik.http.routers.adminer-secure.rule=Host(`db.localhost`)"
      - "traefik.http.routers.adminer-secure.entrypoints=websecure"
      - "traefik.http.routers.adminer-secure.tls=true"
      - "traefik.http.routers.adminer-secure.middlewares=basic-auth@file"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"
      - "com.centurylinklabs.watchtower.enable=true"

  backend:
    build:
      context: ./src/backend
    # Le backend est sur le réseau backend uniquement
    # Il communique avec postgres, redis, mailhog et Traefik
    networks:
      - backend
    environment:
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_KEY: devops:visits
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      MAIL_FROM: no-reply@devops.local
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.localhost`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.routers.backend.middlewares=https-redirect@file"
      - "traefik.http.routers.backend-secure.rule=Host(`api.localhost`)"
      - "traefik.http.routers.backend-secure.entrypoints=websecure"
      - "traefik.http.routers.backend-secure.tls=true"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"
      - "traefik.http.routers.backend-secure.middlewares=security-headers@file,gzip-compress@file,rate-limit@file"
      - "com.centurylinklabs.watchtower.enable=false"
    depends_on:
      - postgres
      - redis
      - mailhog

  frontend:
    build:
      context: ./src/frontend
    # Le frontend est sur le réseau frontend uniquement
    # Il ne peut pas accéder directement à postgres ou redis
    networks:
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`app.localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.middlewares=https-redirect@file"
      - "traefik.http.routers.frontend-secure.rule=Host(`app.localhost`)"
      - "traefik.http.routers.frontend-secure.entrypoints=websecure"
      - "traefik.http.routers.frontend-secure.tls=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=8080"
      - "traefik.http.routers.frontend-secure.middlewares=security-headers@file,gzip-compress@file"
      - "com.centurylinklabs.watchtower.enable=false"
    depends_on:
      - backend
  
  portainer:
    image: portainer/portainer-ce:2.39.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    networks:
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.localhost`)"
      - "traefik.http.routers.portainer.entrypoints=web"
      - "traefik.http.routers.portainer.middlewares=https-redirect@file"
      - "traefik.http.routers.portainer-secure.rule=Host(`portainer.localhost`)"
      - "traefik.http.routers.portainer-secure.entrypoints=websecure"
      - "traefik.http.routers.portainer-secure.tls=true"
      - "traefik.http.routers.portainer-secure.middlewares=security-headers@file"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      - "com.centurylinklabs.watchtower.enable=true"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - backend
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - backend
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    restart: unless-stopped

  trivy-reports:
    image: nginx:alpine
    # Sert les rapports JSON de Trivy comme fichiers statiques via HTTP
    # Grafana peut ainsi lire les fichiers via une URL HTTP
    # car Grafana ne peut pas lire des fichiers directement sur le disque
    volumes:
      - ./docs/security:/usr/share/nginx/html:ro
    networks:
      - backend
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - backend
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`monitor.localhost`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.routers.grafana.middlewares=https-redirect@file"
      - "traefik.http.routers.grafana-secure.rule=Host(`monitor.localhost`)"
      - "traefik.http.routers.grafana-secure.entrypoints=websecure"
      - "traefik.http.routers.grafana-secure.tls=true"
      - "traefik.http.routers.grafana-secure.middlewares=security-headers@file"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "com.centurylinklabs.watchtower.enable=false"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
    restart: unless-stopped
  
  watchtower:
    image: containrrr/watchtower:1.7.1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_NOTIFICATION_URL=${WATCHTOWER_NOTIFICATION_URL}
    networks:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  portainer_data:
  grafana_data:
  prometheus_data:

networks:
  # Réseau exposé — contient Traefik et le Frontend
  frontend:
    driver: bridge
  # Réseau privé — contient le Backend, PostgreSQL, Redis, MailHog, Adminer
  # Isolé du réseau frontend pour la sécurité
  backend:
    driver: bridge