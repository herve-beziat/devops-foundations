services:
  traefik:
    image: traefik:v3.0
    container_name: devops_traefik
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - devops
  postgres:
    image: postgres:16-alpine
    container_name: devops_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devops
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devops_redis
    networks:
      - devops
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: devops_mailhog
    networks:
      - devops
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # UI web
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: devops_adminer
    depends_on:
      - postgres
    ports:
      - "8081:8080"
    networks:
      - devops

  backend:
    build:
      context: ./src/backend
    container_name: devops_backend
    networks:
      - devops
    ports:
      - "3000:3000"
    environment:
      PORT: 3000

      # PostgreSQL (dans Docker => host = nom du service)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      # Redis (dans Docker => host = nom du service)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_KEY: devops:visits

      # MailHog (dans Docker => host = nom du service)
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      MAIL_FROM: no-reply@devops.local
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.middlewares.api-stripprefix.stripprefix.prefixes=/api"
      - "traefik.http.routers.backend.middlewares=api-stripprefix"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"
    depends_on:
      - postgres
      - redis
      - mailhog

  frontend:
    build:
      context: ./src/frontend
    container_name: devops_frontend
    ports:
      - "5173:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - devops
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  devops:
    driver: bridge